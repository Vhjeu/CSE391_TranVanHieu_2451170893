<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Transitions & Animations</title>
    <link rel="stylesheet" href="animations.css">
</head>
<body>

    <div class="container">
        <h2 class="fade-in-element">Danh sách sản phẩm nổi bật</h2>

        <div class="spinner-wrapper">
            <div class="loading-spinner"></div>
            <span>Đang tải dữ liệu...</span>
        </div>

        <div class="card-grid">
            <div class="product-card">
                
                <div class="img-container">
                    <img src="https://picsum.photos/300/200?random=1" alt="Product" class="zoom-img">
                </div>
                
                <div class="card-content">
                    <h3>Bàn phím cơ Bluetooth</h3>
                    <p class="price">1.500.000đ</p>
                    
                    <button class="buy-btn">Mua ngay</button>
                </div>
            </div>

            <div class="product-card">
                <div class="img-container">
                    <img src="https://picsum.photos/300/200?random=2" alt="Product" class="zoom-img">
                </div>
                <div class="card-content">
                    <h3>Chuột Gaming Không Dây</h3>
                    <p class="price">850.000đ</p>
                    <button class="buy-btn">Mua ngay</button>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
